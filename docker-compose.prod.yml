services:
  db-defi-vdc:
    container_name: db-defi-vdc-prod
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - db_data_prod:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  backend-defi-vdc:
    container_name: backend-defi-vdc-prod
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db-defi-vdc-prod
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Europe/Paris
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - db-defi-vdc
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1G

  frontend-defi-vdc:
    container_name: frontend-defi-vdc-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend-defi-vdc
    networks:
      - internal
      - proxy-net
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  db_data_prod:
  uploads_data:

networks:
  internal:
    internal: true
  proxy-net:
    external: true
